# CodeQL code scanning. Uses build-mode: none for every language: CodeQL extracts the
# codebase without compiling, so it needs neither the Orkeon packages nor a restore.
#
# Three languages:
#   - csharp  - Studio itself.
#   - python  - the repository's tooling scripts (scripts/).
#   - actions - the workflows themselves (injection-prone `run:` blocks, unpinned actions).
# `init` and `analyze` must carry the SAME commit: `analyze` refuses the configuration
# an `init` of another version wrote. Each language uploads under its own `category`.
name: CodeQL
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '31 4 * * 1'   # weekly, Monday 04:31 UTC
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read   # required by codeql-action on private repos (workflow-run lookup at upload time)
    strategy:
      # One bad language must not hide the findings of the other three.
      fail-fast: false
      matrix:
        language: [ csharp, python, actions ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
