# Build and test Orkeon Studio.
#
# Studio consumes Orkeon as NuGet packages from nuget.org, at the OrkeonVersion of
# Directory.Packages.props.
#
# The drift tests of Orkeon.Studio.Core.Tests read files Orkeon ships but does not package
# (example crews, the installer's sample settings, the tool inventory, the CLI sources):
# the job clones the Orkeon tag v<OrkeonVersion> next to the checkout and points
# ORKEON_SOURCE_ROOT at it.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      ORKEON_SOURCE_ROOT: ${{ github.workspace }}/.orkeon-src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check comments carry no accented letter
        run: python3 scripts/check-comment-accents.py
      - name: Clone the Orkeon sources the drift tests read
        # The tag of the packages Studio builds against (OrkeonVersion), so the drift tests
        # read the sources of those packages, not whatever main holds today.
        run: |
          version=$(sed -n 's|.*<OrkeonVersion>\(.*\)</OrkeonVersion>.*|\1|p' Directory.Packages.props)
          git init -q "$ORKEON_SOURCE_ROOT"
          git -C "$ORKEON_SOURCE_ROOT" fetch -q --depth 1 --filter=blob:none https://github.com/Orkeon/orkeon "refs/tags/v$version"
          git -C "$ORKEON_SOURCE_ROOT" checkout -q FETCH_HEAD
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with: { global-json-file: global.json }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore Orkeon.Studio.sln
      - run: dotnet build Orkeon.Studio.sln -c Release --no-restore -warnaserror
      - run: dotnet test Orkeon.Studio.sln -c Release --no-build --filter "Category!=Integration&Category!=Slow"

  build-wpf:
    # The WPF front-end targets net10.0-windows; its ViewModels are tested on Linux by link
    # (Orkeon.Studio.Wpf.Tests), the XAML is compiled here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with: { global-json-file: global.json }
      - run: dotnet restore src/apps/Orkeon.Studio.Wpf/Orkeon.Studio.Wpf.csproj
      - run: dotnet build src/apps/Orkeon.Studio.Wpf/Orkeon.Studio.Wpf.csproj -c Release --no-restore -warnaserror
